name: CI

on: [push, pull_request]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pytest rich
      - name: Run pytest
        run: pytest tests/test_ghee.py

  test-bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bats
        uses: bats-core/bats-action@4.0.0
        with:
          bats-version: 1.11.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - name: Run Bats Tests
        run: bats tests/test_modules.bats

  test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build package
        run: pip install build && python -m build
      - name: Install wheel and smoke-test CLI
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/venv/bin/ghee --help
          /tmp/venv/bin/ghee info docker
